<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Responsive Image Gallery</h2>

    <p>Resize the browser window to see the effect.</p>

    <div class="gallery-container">

        <div class="responsive">
            <div class="gallery">
                <img src="images/img1.jpg" alt="Ảnh 1">
                <div class="desc">Mô tả hình ảnh 1</div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery">
                <img src="images/img2.jpg" alt="Ảnh 2">
                <div class="desc">Mô tả hình ảnh 2</div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery">
                <img src="images/img3.jpg" alt="Ảnh 3">
                <div class="desc">Mô tả hình ảnh 3</div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery">
                <img src="images/img4.jpg" alt="Ảnh 4">
                <div class="desc">Mô tả hình ảnh 4</div>
            </div>
        </div>

    </div>

</body>
</html>
